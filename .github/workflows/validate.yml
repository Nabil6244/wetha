name: Validate foundation
on: [push, pull_request]
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv
      - run: uv pip sync backend/requirements.lock --require-hashes
      - run: npm ci
      - name: Install FFmpeg for Linux render tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg for macOS render tests
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg for Windows render tests
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:ui
